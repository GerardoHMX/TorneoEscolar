<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Marcador en vivo para la TV. Datos: CSV publicados de Google Sheets + Firestore (directo).
         Firestore usa firestore.googleapis.com (WebChannel); el SDK se carga desde www.gstatic.com. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https://docs.google.com https://*.googleusercontent.com https://firestore.googleapis.com; object-src 'none'; base-uri 'self'">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#a30f14">
    <title>Marcador en vivo · Al-Ándalus</title>
    <link rel="preload" href="fonts/LALIGAHeadlineVF.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="fonts/Roboto-VF-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preconnect" href="https://docs.google.com">
    <link rel="stylesheet" href="css/marcador.css?v=20261128">
    <link rel="icon" href="img/logo-colegio.svg" type="image/svg+xml">
</head>
<body>
    <main class="stage" id="stage" aria-label="Marcador del partido"></main>
    <p class="tv-hint" id="hint">Haz clic o pulsa Enter para ver a pantalla completa</p>
    <p class="tv-status" id="status" role="status" hidden></p>
    <noscript><p style="color:#fff;font:600 20px system-ui;padding:24px">El marcador necesita JavaScript.</p></noscript>
    <script type="module" src="js/live/tv.js?v=20261128"></script>
</body>
</html>
